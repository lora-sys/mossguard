name: Playground delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build MossGuard and workspace dependencies
        run: pnpm --filter @mossguard/playground... build
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: mossguard-playground-${{ github.sha }}
          path: apps/playground/dist
          if-no-files-found: error
          retention-days: 14
